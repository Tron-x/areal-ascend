# Cluster preset: 2-bare-metal-node with storage on the non-trainer host.
#
# INFRA-OWNED.  Reference from the algo YAML via
# ``launcher_preset: 2node_dedicated_ps``.  Same wiring as
# ``2node_colocated`` except the storage role lives next to the
# generator instead of next to the trainer.
#
# Difference from ``2node_colocated.yaml`` (the default colocated
# layout):
#
#   default: trainer + storage on the driver host (same box)
#            generator on the non-driver host
#            put  traffic: same-host HCCS    (trainer -> storage)
#            pull traffic: cross-node RoCE   (storage -> worker)
#
#   this:    trainer on the driver host
#            storage + generator on the non-driver host
#            put  traffic: cross-node RoCE   (trainer -> storage)
#            pull traffic: same-host HCCS    (storage -> worker)
#
# Use this variant to measure whether the choice of which leg rides
# RoCE vs HCCS matters for end-to-end sync latency.  It also verifies
# that the mesh-injection plumbing (backend accepts an externally
# spawned storage proc_mesh) actually works for a non-colocated PS --
# which is the intended building block for larger "PS cluster on
# dedicated nodes" topologies we'll want later.

launcher:
  type: bare_metal

  # See ``2node_colocated.yaml`` for the ``launcher_impl`` rationale.
  launcher_impl: ssh_job

  # Cluster pool -- see ``cluster/monarch_2node.yaml`` for the
  # canonical definition.  Inlined here because the plain OmegaConf
  # loader in ``_load_yaml_launcher_block`` doesn't resolve Hydra
  # ``defaults:`` lists.
  pool:
    - host: 192.168.0.26
      port: 22222
      hardware: npu
      n_devices: 8
    - host: 192.168.0.23
      port: 22222
      hardware: npu
      n_devices: 8
      role: driver

  # Same role declarations as the colocated variant, except
  # ``storage.colocate`` flips from ``trainer`` to ``generator`` --
  # that's the entire topology difference.
  #
  # Scheduler (greedy, biggest-effective-footprint first):
  #   generator+storage = 1+4 = 5 effective -> driver host first
  #   trainer+reward    = 4+0 = 4 effective -> non-driver host
  #
  # Net layout (both hosts have n_devices=8; scheduler validates):
  #   driver host: generator(1) + storage(4) = 5
  #   non-driver:  trainer(4)   + reward(0)  = 4
  # ``put``  (trainer -> storage) crosses RoCE (~200 Gb/s per NIC).
  # ``pull`` (storage -> generator) stays intra-host on HCCS.
  # This flips the traffic pattern of the colocated variant -- pick
  # whichever side (put vs pull) you want on the fast fabric.
  roles:
    trainer:
      devices: 4
      hardware: npu

    generator:
      devices: 1
      hardware: npu

    # The only meaningful change vs the colocated YAML: storage
    # colocates with generator instead of trainer, so the PS lands
    # on the non-trainer host.  ``put`` now crosses RoCE; ``pull``
    # stays intra-host HCCS.
    storage:
      devices: 4
      hardware: npu
      colocate: generator

    reward:
      devices: 0
      hardware: npu
      colocate: trainer

  # Weight-sync block schema is identical to the colocated variant;
  # see ``2node_colocated.yaml`` for the fully-commented field
  # catalog.  This file only overrides what actually differs in the
  # dedicated-PS topology (storage_npu_base).
  weight_sync:
    method: torchstore
    backend: torchstore_multi_vol
    storage_role: storage
    storage_spawn_mode: driver
    pool_mb: 6144
    eager_d2h: false
    shard_publish: false
    # When storage lives on a host that runs *no* trainer ranks, NPU
    # 0 on that host is free.  Setting storage_npu_base: 4 keeps the
    # layout identical to the colocated case for a fair A/B (storage
    # always on NPU 4..7).  Use 0 if you want to compete with vLLM
    # for NPU 0 instead.
    storage_npu_base: 4
    bcast:
      src_vol_idx: 0
      master_port: null
    ps_world: 0
