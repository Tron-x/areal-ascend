# Launcher topology for forge's 2-bare-metal-node GRPO run.
#
# ALGORITHM-OWNED.  This file declares *how the algorithm wants to
# use the cluster*: per-role device counts, colocation constraints,
# weight-sync policy.  The cluster itself (pool of machines) is
# declared in ``cluster/monarch_2node.yaml`` and composed in via
# Hydra's ``defaults:``.
#
# R1.5c mental model:
#
#   cluster yaml   "what hardware exists"        -> launcher.pool[]
#   experiment yaml (this file)  "how I want to use it"  -> launcher.roles[]
#   scheduler      "bind them"                   -> host_idx per role
#
# Priority order for every field (highest wins):
#
#   1. CLI flags on ``python -m forge.apps.grpo``
#   2. Environment variables (TORCHSTORE_MONARCH_RDMA_POOL_MB, etc.)
#   3. YAML ``launcher:`` block below (or the composed cluster YAML)
#   4. Python dataclass defaults in ``forge/core/types.py``
#
# Legacy ``bare_metal.workers`` + ``meshes.<name>.host_idx`` still
# work and are respected when authored explicitly -- that's the
# escape hatch for "I want THIS role on THAT host, screw the
# scheduler".  Default path (below) lets the scheduler place
# everything based on device requests.

launcher:
  type: bare_metal

  # Cluster pool -- infrastructure declaration.  Kept inline so the
  # plain OmegaConf loader in ``_load_yaml_launcher_block`` (no Hydra
  # compose) can read it directly.  This block is a copy of
  # ``cluster/monarch_2node.yaml`` -- keep the two in sync until we
  # switch the launcher loader to Hydra composition.
  pool:
    - host: 192.168.0.26
      port: 22222
      hardware: npu
      n_devices: 8
    - host: 192.168.0.23
      port: 22222
      hardware: npu
      n_devices: 8
      role: driver

  # Role-centric resource declaration.  Each entry asks for a fixed
  # count of accelerator devices; the scheduler picks a host from
  # ``launcher.pool`` that has enough free.  Parallelism strategy
  # (FSDP dp/tp, vLLM TP, ...) is independent and lives in the
  # workload YAML (actor / service configs), NOT here.
  #
  # Field reference (see ``forge/docs/role_abstraction_design.md``):
  #   devices   : accelerator card count this role needs.
  #   hardware  : accelerator tier (today: "npu" only).
  #   colocate  : pin this role to the same host as another role.
  #   host_idx  : legacy escape hatch -- override scheduler with an
  #               explicit pool index.  Prefer ``colocate:``.
  roles:
    # FSDP trainer: uses all 8 NPUs on its host (dp=8, tp=1).
    trainer:
      devices: 8
      hardware: npu

    # vLLM generator: TP=1 on 1 NPU on the other host.  Parallelism
    # strategy (TP size, num_replicas, ...) is set in the workload
    # YAML, not here.
    generator:
      devices: 1
      hardware: npu

    # Torchstore parameter server: 4 volumes colocated on the trainer
    # host.  ``put`` traffic stays intra-host (HCCS), ``pull`` goes
    # cross-machine (RoCE, ~200 Gb/s per NIC).  Flip colocate to
    # "generator" for the "dedicated PS on generator host" topology
    # (see ``launcher_bare_metal_2node_dedicated_ps.yaml``).
    storage:
      devices: 4
      hardware: npu
      colocate: trainer

    # Reward evaluator: 1 CPU proc pinned next to the trainer so it
    # doesn't contend with generator's NPUs.  ``devices: 0`` keeps
    # it off the accelerator.
    reward:
      devices: 0
      hardware: npu
      colocate: trainer

  # Weight-sync data-plane configuration.  Authoritative: every field
  # below is read by ``forge.apps.grpo`` via
  # ``forge.engines.weight_sync._config_resolver`` with precedence
  # ``yaml > env > default``.  Setting any field here makes that field
  # immune to env-var overrides (and silences the deprecation warning
  # a legacy env var would otherwise trigger).  See
  # ``forge/docs/env_to_yaml_mapping.md`` for the complete field
  # catalog and env-equivalence table.
  weight_sync:
    # -- Method / backend selection -----------------------------------
    # method: sync dispatch path.
    #   "torchstore" = route through WeightSyncService + pluggable
    #                  backend below (recommended).
    #   "nccl" / "checkpoint" / "hixl" = legacy paths (see §5 Q1 of
    #                  env_to_yaml_mapping.md).
    method: torchstore

    # backend: which torchstore backend to use when method=torchstore.
    # Registered names live in
    # ``forge/engines/weight_sync/backends/__init__.py``:
    #   torchstore_multi_vol (default, works at any gen TP; uses
    #     per-worker ts.get which is fine at TP=1 but scales
    #     connections as TP × num_vols at TP>1 and triggers HiXL
    #     103901 — flip to collective_broadcast when you go TP>1).
    #   collective_broadcast (opt-in for gen TP>1; storage vol 0
    #     becomes the HCCL broadcast source, fanout 1+TP over one
    #     HCCL group — see weight_sync.md §7.4).
    #   dedicated_ps (future — standalone parameter-server nodes).
    #   areal_xccl (HiXL-free fallback via plain HCCL broadcast).
    backend: torchstore_multi_vol

    # -- Storage placement --------------------------------------------
    # storage_role: which entry in ``roles:`` hosts the storage
    # volumes.  Must match a role name above.  Renamed from
    # ``storage_mesh`` in R1.5 -- old name still works for one
    # release window with a DeprecationWarning.
    storage_role: storage

    # storage_npu_base: first NPU id on the storage host that storage
    # volumes bind to.  ``null`` = auto (uses ``train_world_size`` as
    # the offset so storage doesn't collide with trainer NPUs on a
    # colocated host).  For dedicated storage hosts (no trainer on
    # that box) set to 0.
    storage_npu_base: null

    # storage_spawn_mode: who provisions the storage ProcMesh.
    #   "driver" (default) -- forge driver spawns storage and injects
    #     the mesh into the backend constructor (topology-agnostic).
    #   "backend" -- legacy; backend spawns storage itself on the
    #     trainer host.  Rare; only useful during backend-side
    #     refactors.
    storage_spawn_mode: driver

    # -- Transport tuning ---------------------------------------------
    # pool_mb: MonarchRDMA staging pool per torchstore transport proc
    # (MiB).  The pool lives inside whichever proc calls ts.put / ts.get
    # — on the trainer side that's rank 0, which shares NPU 0 with
    # FSDP's model/optim/activation state.  After a rollout, trainer
    # NPU 0 typically has ~8 GiB free; an 8192 MiB pool sits right on
    # the edge of OOM there.  6144 MiB gives comfortable headroom for
    # Qwen3-0.6B (1.4 GiB flat + staging slack).  Bump to 8192 for
    # bigger models once trainer NPU 0 pressure drops.
    pool_mb: 6144

    # eager_d2h: whether torchstore's transport staging should copy
    # tensors out to host memory before enqueuing the RDMA op.
    # ``false`` (recommended) keeps staging on-device and lets HiXL
    # do the NPU-to-NPU transfer with no host hop.  ``true`` is only
    # useful when debugging HiXL memory registration issues.
    eager_d2h: false

    # -- Trainer-side shard-parallel publish --------------------------
    # shard_publish: when ``true``, every trainer FSDP rank publishes
    # its own byte-shard of the flat state_dict to its matching
    # storage volume in parallel (uses all N RoCE NICs).  Measured
    # agg throughput ~32 GB/s at TP=1 on our 2-node setup.
    # Incompatible with backend=collective_broadcast (the bcast source
    # needs the full tensor in one vol).  Default ``false``.
    shard_publish: false

    # -- collective_broadcast backend tuning --------------------------
    # These fields only matter when backend=collective_broadcast.
    bcast:
      # Which storage vol acts as the HCCL broadcast source.  Must be
      # in [0, train_world_size).  0 is almost always right.
      src_vol_idx: 0
      # TCP port for the HCCL TCPStore rendezvous.  ``null`` = auto-
      # allocate a free port.  Pin to a fixed port for deterministic
      # deployments or firewall-restricted environments.
      master_port: null

    # -- Future: dedicated-PS topology --------------------------------
    # Number of dedicated parameter-server procs.  0 = disabled.
    # Requires backend=dedicated_ps (not implemented yet).
    ps_world: 0
