# Launcher topology for forge's 2-bare-metal-node GRPO run.
#
# This file is consumed by ``forge/apps/grpo.py::main()`` as the
# source of truth for multi-node placement.  Only the ``launcher:``
# block is read by forge; the rest of the AReaL experiment YAML
# (dataset / rollout / gconfig / ...) continues to be composed by
# AReaL's Hydra+OmegaConf pipeline as before.  To use it, add this
# block to whichever AReaL experiment YAML you're running -- either
# inline copy it, or use Hydra's composition (``defaults: [...]``).
#
# Priority order for every field below (highest wins):
#
#   1. CLI flags on ``python -m forge.apps.grpo``
#        (``--bare-metal-workers``, ``--mesh-placement``, ...)
#   2. Environment variables
#        (``FORGE_MESH_PLACEMENT``, ``FORGE_STORAGE_HOST_MESH``,
#         ``TORCHSTORE_MONARCH_RDMA_POOL_MB``, ...)
#   3. YAML ``launcher:`` block below
#   4. Python dataclass defaults (``forge/core/types.py::LauncherConfig``)
#
# ``run_multinode.sh`` injects a hostfile-derived workers list via CLI,
# so this YAML's ``workers:`` field is a documentation/fallback only --
# it matters when somebody launches ``python -m forge.apps.grpo`` by
# hand without going through the wrapper script.

launcher:
  # Launcher kind.  Today we only ship ``bare_metal``; slurm / k8s
  # are delegated to monarch's native launchers and will land here
  # as ``type: slurm`` + their own sub-block when we wire those up.
  type: bare_metal

  # Bare-metal specifics.  Other launcher types add their own sibling
  # sub-block (``slurm:``, ``k8s:``, ...) that the matching launcher
  # class picks up.  Unknown keys are ignored, so migrations are easy.
  bare_metal:
    # Monarch worker URIs, in the exact order they populate the
    # launcher's ``workers`` array.  ``host_idx: N`` in ``meshes:``
    # below refers to the N-th entry here.
    #
    # Note: ``run_multinode.sh`` builds the effective workers list from
    # ``forge/configs/hostfile.txt`` at runtime and passes it via
    # ``--bare-metal-workers``, which takes precedence over whatever's
    # written here (CLI > env > YAML).  So this field is a documented
    # fallback for direct ``python -m forge.apps.grpo`` invocations.
    # Keep the ordering identical to hostfile.txt to avoid confusion.
    workers:
      - tcp://192.168.0.26:22222
      - tcp://192.168.0.23:22222
    # The "driver" address (where ``run_multinode.sh`` fires
    # ``python -m forge.apps.grpo`` from).  Auto-detected if empty.
    # With the hostfile above, the driver is monarch1 (0.23).
    master_addr: 192.168.0.23
    worker_port: 22222

  # Named mesh placements.  ``BareMetalLauncher.get_host_mesh(name)``
  # consults this map first and falls back to round-robin only for
  # names not listed.  Explicit placement is strongly preferred --
  # round-robin is a usability crutch that breaks silently when new
  # mesh names enter the code base.
  #
  # host_idx is an integer index into bare_metal.workers[].  The dict
  # form is used (rather than a bare int) so future launcher types
  # can add sibling keys next to host_idx without a schema break --
  # for slurm this becomes ``{slurm_mesh_name: trainer}``; for k8s,
  # ``{node_selector: {role: trainer}}``.
  # NB: ``workers:`` above is an *ordered* array -- host_idx is an
  # integer index into it.  For a 2-node job launched by
  # ``run_multinode.sh``, the DRIVER_HOST is picked from the *second*
  # line of the hostfile (so actors with ``hosts=None`` that fall back
  # to ``this_host()`` end up there).  In the default ``hostfile.txt``
  # layout ("192.168.0.26\n192.168.0.23"), this means:
  #
  #   workers[0] -> 192.168.0.26 = monarch2 (non-driver node)
  #   workers[1] -> 192.168.0.23 = monarch1 (driver, where the
  #                                python -m forge.apps.grpo process
  #                                runs, and therefore where
  #                                ``this_host()`` resolves to)
  #
  # Forge's TrainerActor is spawned with ``hosts=None`` so it rides
  # ``this_host()`` directly; YAML-declared trainer placement is
  # documentation-only.  Generator and storage go through
  # ``launcher.get_host_mesh(name)`` and are actually controlled by
  # host_idx.  The default layout below keeps trainer & storage
  # colocated (both on monarch1 = driver) and pins generator to the
  # other node (monarch2).  Flip storage.host_idx -> 0 to run the
  # "dedicated PS on generator's host" topology.
  meshes:
    trainer:
      host_idx: 1         # monarch1 (driver host via this_host()).  Value
                          # is ignored by the launcher today but kept
                          # here for completeness.
    generator:
      host_idx: 0         # monarch2 -- 1 NPU (0) for vLLM
    storage:
      host_idx: 1         # monarch1, colocated with trainer.  Set to 0
                          # to relocate storage to monarch2 ("dedicated
                          # PS") -- put traffic becomes cross-machine
                          # RoCE, pull stays intra-host HCCS.

  # Weight-sync data-plane configuration.  Authoritative: every field
  # below is read by ``forge.apps.grpo`` via
  # ``forge.engines.weight_sync._config_resolver`` with precedence
  # ``yaml > env > default``.  Setting any field here makes that field
  # immune to env-var overrides (and silences the deprecation warning
  # a legacy env var would otherwise trigger).  See
  # ``forge/docs/env_to_yaml_mapping.md`` for the complete field
  # catalog and env-equivalence table.
  weight_sync:
    # -- Method / backend selection -----------------------------------
    # method: sync dispatch path.
    #   "torchstore" = route through WeightSyncService + pluggable
    #                  backend below (recommended).
    #   "nccl" / "checkpoint" / "hixl" = legacy paths (see §5 Q1 of
    #                  env_to_yaml_mapping.md).
    method: torchstore

    # backend: which torchstore backend to use when method=torchstore.
    # Registered names live in
    # ``forge/engines/weight_sync/backends/__init__.py``:
    #   torchstore_multi_vol (default, works at any gen TP; uses
    #     per-worker ts.get which is fine at TP=1 but scales
    #     connections as TP × num_vols at TP>1 and triggers HiXL
    #     103901 — flip to collective_broadcast when you go TP>1).
    #   collective_broadcast (opt-in for gen TP>1; storage vol 0
    #     becomes the HCCL broadcast source, fanout 1+TP over one
    #     HCCL group — see weight_sync.md §7.4).
    #   dedicated_ps (future — standalone parameter-server nodes).
    #   areal_xccl (HiXL-free fallback via plain HCCL broadcast).
    backend: torchstore_multi_vol

    # -- Storage placement --------------------------------------------
    # storage_mesh: which entry in the ``meshes:`` map above should
    # host the storage volumes.  "storage" is the conventional name.
    # Set to "trainer" to colocate with the trainer host (saves a
    # cross-machine hop but puts torchstore's staging pool on the
    # same NPU that FSDP is using).
    storage_mesh: storage

    # storage_npu_base: first NPU id on ``storage_mesh``'s host that
    # storage volumes bind to.  ``null`` = auto (uses
    # ``train_world_size`` as the offset so storage doesn't collide
    # with trainer's NPUs on a colocated host).  For dedicated
    # storage hosts (no trainer on that box) set to 0.
    storage_npu_base: null

    # storage_spawn_mode: who provisions the storage ProcMesh.
    #   "driver" (default) -- forge driver spawns storage and injects
    #     the mesh into the backend constructor (topology-agnostic).
    #   "backend" -- legacy; backend spawns storage itself on the
    #     trainer host.  Rare; only useful during backend-side
    #     refactors.
    storage_spawn_mode: driver

    # -- Transport tuning ---------------------------------------------
    # pool_mb: MonarchRDMA staging pool per torchstore transport proc
    # (MiB).  The pool lives inside whichever proc calls ts.put / ts.get
    # — on the trainer side that's rank 0, which shares NPU 0 with
    # FSDP's model/optim/activation state.  After a rollout, trainer
    # NPU 0 typically has ~8 GiB free; an 8192 MiB pool sits right on
    # the edge of OOM there.  6144 MiB gives comfortable headroom for
    # Qwen3-0.6B (1.4 GiB flat + staging slack).  Bump to 8192 for
    # bigger models once trainer NPU 0 pressure drops.
    pool_mb: 6144

    # eager_d2h: whether torchstore's transport staging should copy
    # tensors out to host memory before enqueuing the RDMA op.
    # ``false`` (recommended) keeps staging on-device and lets HiXL
    # do the NPU-to-NPU transfer with no host hop.  ``true`` is only
    # useful when debugging HiXL memory registration issues.
    eager_d2h: false

    # -- Trainer-side shard-parallel publish --------------------------
    # shard_publish: when ``true``, every trainer FSDP rank publishes
    # its own byte-shard of the flat state_dict to its matching
    # storage volume in parallel (uses all N RoCE NICs).  Measured
    # agg throughput ~32 GB/s at TP=1 on our 2-node setup.
    # Incompatible with backend=collective_broadcast (the bcast source
    # needs the full tensor in one vol).  Default ``false``.
    shard_publish: false

    # -- collective_broadcast backend tuning --------------------------
    # These fields only matter when backend=collective_broadcast.
    bcast:
      # Which storage vol acts as the HCCL broadcast source.  Must be
      # in [0, train_world_size).  0 is almost always right.
      src_vol_idx: 0
      # TCP port for the HCCL TCPStore rendezvous.  ``null`` = auto-
      # allocate a free port.  Pin to a fixed port for deterministic
      # deployments or firewall-restricted environments.
      master_port: null

    # -- Future: dedicated-PS topology --------------------------------
    # Number of dedicated parameter-server procs.  0 = disabled.
    # Requires backend=dedicated_ps (not implemented yet).
    ps_world: 0
