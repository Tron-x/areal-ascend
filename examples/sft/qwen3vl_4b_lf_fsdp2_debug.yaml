# LlamaFactory smoke config -- Qwen3-VL-4B-Instruct + FSDP2 on NPU.
#
# Adapted from upstream LF's
# ``examples/ascend/qwen3vlmoe_full_sft_fsdp2.yaml`` (which targets a
# 30B MoE model) for the 4B dense Qwen3-VL.  The structural diffs vs.
# upstream are:
#
#   model_name_or_path  Qwen3-VL-30B-A3B-Instruct -> Qwen3-VL-4B-Instruct
#   dataset             llava_1k_en, llava_1k_zh -> mllm_demo
#                       (offline-friendly bundled multimodal demo;
#                       HuggingFace is not reachable from this cluster
#                       and ModelScope's llava_1k_* mirror is gated)
#   cutoff_len          1024 -> 512  (smoke-sized seqs)
#   per_device_train_batch_size  2 -> 1
#   max_steps           500 -> 3
#   logging_steps       1 (kept; want every step to print loss in smoke)
#   save_steps          500 -> 1000  (>max_steps; effectively no save)
#   output_dir          /tmp/lf_smoke/qwen3vl_4b_sft
#                       (ephemeral; driver --output-dir overrides per run)
#   trust_remote_code   true (kept; Qwen3-VL ships custom modelling code)
#   flash_attn          fa2  (NPU supports FA2 via transformers' NPU
#                            fallback to torch_npu.npu_fusion_attention,
#                            no flash_attn pip package needed -- LF's
#                            model/model_utils/attention.py:80 short
#                            circuits ``is_torch_npu_available()``)
#
# This YAML is invoked by ``forge/scripts/llamafactory_train_singlehost.py``,
# which loads it as a dict and forwards it to ``run_exp(args=...)`` --
# byte-for-byte equivalent to upstream's
# ``accelerate launch --config_file fsdp2.yaml src/train.py <this_yaml>``
# modulo the rank-topology env vars (Monarch owns those).

### model
model_name_or_path: Qwen/Qwen3-VL-4B-Instruct
image_max_pixels: 262144
video_max_pixels: 16384
trust_remote_code: true
use_v1_kernels: true
flash_attn: fa2

### method
stage: sft
do_train: true
finetuning_type: full
disable_gradient_checkpointing: false

### dataset
dataset: mllm_demo
template: qwen3_vl
cutoff_len: 512
overwrite_cache: true
preprocessing_num_workers: 4
dataloader_num_workers: 0   # smoke: avoid worker fork overhead

### output
output_dir: /tmp/lf_smoke/qwen3vl_4b_sft
logging_steps: 1
save_steps: 1000   # > max_steps so no checkpoint write during smoke
max_steps: 3
plot_loss: false   # smoke -- no matplotlib dep
overwrite_output_dir: true
save_only_model: true
report_to: none

### train
per_device_train_batch_size: 1
gradient_accumulation_steps: 1
learning_rate: 1.0e-4
lr_scheduler_type: cosine
warmup_ratio: 0.1
bf16: true
ddp_timeout: 180000000
resume_from_checkpoint: null
seed: 1234
